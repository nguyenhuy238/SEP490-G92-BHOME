name: CI
on:
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/backend/BHome.sln
      - run: dotnet build src/backend/BHome.sln -c Release --no-restore
      # Capture tests use the same source-built MinIO image as local Compose.
      - name: Build MinIO image for integration tests
        run: docker build -f deploy/docker/Minio.Dockerfile -t bhome/minio-local:2025-10-15 .
      # GitHub's Linux runner provides Docker for PostgreSQL/MinIO Testcontainers.
      - run: dotnet test src/backend/BHome.sln -c Release --no-build --logger trx
      - run: dotnet format src/backend/BHome.sln --verify-no-changes --no-restore
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run format:check
      - run: docker compose --env-file .env.example config --quiet
