name: CI
on:
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      compact_postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bhome_ci
          # Disposable fixture credential only; never used by a deployed BHOME environment.
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U bhome_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src/backend/BHome.sln
      - run: dotnet build src/backend/BHome.sln -c Release --no-restore
      # Capture tests use the same source-built MinIO image as local Compose.
      - name: Build MinIO image for integration tests
        run: docker build -f deploy/docker/Minio.Dockerfile -t bhome/minio-local:2025-10-15 .
      - name: Build LibreOffice image for contract PDF integration tests
        run: docker build -f deploy/docker/ContractConverter.Dockerfile -t bhome/contract-converter:local .
      - name: Capture disposable Compact24 statements without bind parameters
        env:
          COMPACT_POSTGRES: ${{ job.services.compact_postgres.id }}
        run: |
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "ALTER SYSTEM SET log_parameter_max_length = 0"
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "ALTER SYSTEM SET log_parameter_max_length_on_error = 0"
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "ALTER SYSTEM SET log_line_prefix = '%m [%p] db=%d '"
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "ALTER SYSTEM SET log_statement = 'all'"
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "SELECT pg_reload_conf()"
          docker logs --follow "$COMPACT_POSTGRES" > "$RUNNER_TEMP/bhome-compact24-statements.log" 2>&1 &
          echo "BHOME_COMPACT24_QUERY_LOG=$RUNNER_TEMP/bhome-compact24-statements.log" >> "$GITHUB_ENV"
      # GitHub's Linux runner provides Docker for PostgreSQL/MinIO Testcontainers.
      - run: dotnet test src/backend/BHome.sln -c Release --no-build --settings tests/backend/ci.runsettings --logger trx -m:1
        env:
          BHOME_COMPACT24_TEST_ADMIN: Host=127.0.0.1;Port=${{ job.services.compact_postgres.ports[5432] }};Database=postgres;Username=bhome_ci;Password=synthetic-ci-only
      - run: dotnet format src/backend/BHome.sln --verify-no-changes --no-restore
      - name: Test digital signing unit suite
        run: dotnet test src/digital-signing/tests/BHome.DigitalSigning.UnitTests/BHome.DigitalSigning.UnitTests.csproj -c Release --settings tests/backend/ci.runsettings --logger trx
  frontend:
    runs-on: ubuntu-24.04
    env:
      VITE_API_BASE_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck --workspace ./src/mobile
      - run: npm test
      - run: npm run build
      - name: Export Mobile web bundle
        working-directory: src/mobile
        run: npx --no-install expo export --platform web --max-workers 2 --output-dir dist
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid
      - run: npm run format:check
      - run: docker compose --env-file .env.example config --quiet
