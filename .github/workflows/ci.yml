name: CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      compact_postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bhome_ci
          # Disposable fixture credential only; never used by a deployed BHOME environment.
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U bhome_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Configure isolated .NET SDK installation
        # Runner paths are available inside steps, not job-level env expressions.
        run: |
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/.dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT=$RUNNER_TEMP/.dotnet" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Verify .NET SDK installation
        run: dotnet --info
      - run: dotnet restore src/backend/BHome.sln
      - run: dotnet build src/backend/BHome.sln -c Release --no-restore
      # Capture tests use the same source-built MinIO image as local Compose.
      - name: Build MinIO image for integration tests
        run: docker build -f deploy/docker/Minio.Dockerfile -t bhome/minio-local:2025-10-15 .
      - name: Build LibreOffice image for contract PDF integration tests
        run: docker build -f deploy/docker/ContractConverter.Dockerfile -t bhome/contract-converter:local .
      - name: Capture disposable Compact24 statements without bind parameters
        env:
          COMPACT_POSTGRES: ${{ job.services.compact_postgres.id }}
        run: |
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "ALTER SYSTEM SET log_parameter_max_length = 0"
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "ALTER SYSTEM SET log_parameter_max_length_on_error = 0"
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "ALTER SYSTEM SET log_line_prefix = '%m [%p] db=%d '"
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "ALTER SYSTEM SET log_statement = 'all'"
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "SELECT pg_reload_conf()"
          docker logs --follow "$COMPACT_POSTGRES" > "$RUNNER_TEMP/bhome-compact24-statements.log" 2>&1 &
          echo "BHOME_COMPACT24_QUERY_LOG=$RUNNER_TEMP/bhome-compact24-statements.log" >> "$GITHUB_ENV"
      # GitHub's Linux runner provides Docker for PostgreSQL/MinIO Testcontainers.
      - run: dotnet test src/backend/BHome.sln -c Release --no-build --settings tests/backend/ci.runsettings --logger trx --results-directory "$RUNNER_TEMP/bhome-backend-trx" -m:1
        env:
          BHOME_COMPACT24_TEST_ADMIN: Host=127.0.0.1;Port=${{ job.services.compact_postgres.ports['5432'] }};Database=postgres;Username=bhome_ci;Password=synthetic-ci-only
      # Preserve concise test outcomes even if verbose Testcontainers logs are
      # too large for the Actions job-log download endpoint.
      - name: Upload backend test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-trx-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bhome-backend-trx/*.trx
          if-no-files-found: warn
          retention-days: 7
      - run: dotnet format src/backend/BHome.sln --verify-no-changes --no-restore
      - name: Verify SePay team configuration scripts without private credentials
        shell: pwsh
        run: ./scripts/Test-SePaySandboxScripts.ps1
      - name: Test digital signing unit suite
        run: dotnet test src/digital-signing/tests/BHome.DigitalSigning.UnitTests/BHome.DigitalSigning.UnitTests.csproj -c Release --settings tests/backend/ci.runsettings --logger trx
  frontend:
    runs-on: ubuntu-24.04
    env:
      VITE_API_BASE_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck --workspace ./src/mobile
      - run: npm test
      - run: npm run build
      - name: Export Mobile web bundle
        working-directory: src/mobile
        run: npx --no-install expo export --platform web --max-workers 2 --output-dir dist
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid
      - run: npm run format:check
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --project-name bhome-sepay-ci --env-file .env.sepay.example -f deploy/compose.sepay.yml config --quiet
  build-staging-images:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop')
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: bhome-staging-images
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Api.Release.Dockerfile
          target: api
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/bhome-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=staging-api
          cache-to: type=gha,mode=max,scope=staging-api
      - name: Build and publish Owner Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Web.Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            APP=owner-web
            VITE_API_BASE_URL=${{ vars.BHOME_STAGING_API_ORIGIN || 'https://api-sepay-test.103.146.23.157.sslip.io' }}
          tags: ghcr.io/${{ github.repository_owner }}/bhome-owner-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=staging-owner-web
          cache-to: type=gha,mode=max,scope=staging-owner-web
