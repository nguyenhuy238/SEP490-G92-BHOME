name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop, 'release/**']
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  change-detection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/Detect-CiScope.cjs "$RUNNER_TEMP/ci-scope.json"
      - uses: actions/upload-artifact@v6
        with:
          name: ci-scope-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-scope.json
          if-no-files-found: error
          retention-days: 7
  backend:
    runs-on: ubuntu-24.04
    services:
      compact_postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bhome_ci
          # Disposable fixture credential only; never used by a deployed BHOME environment.
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U bhome_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Configure isolated .NET SDK installation
        # Runner paths are available inside steps, not job-level env expressions.
        run: |
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/.dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT=$RUNNER_TEMP/.dotnet" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Verify .NET SDK installation
        run: dotnet --info
      - name: Resolve installed .NET SDK for dependency cache
        id: dotnet-sdk
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"
      # Only cache downloaded packages. Restore and build still validate the current source.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-sdk.outputs.version }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config', '**/packages.lock.json', '**/*.sln', '**/*.slnf') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-sdk.outputs.version }}-
      - run: dotnet restore src/backend/BHome.sln
      - run: dotnet build src/backend/BHome.sln -c Release --no-restore
      - run: dotnet format src/backend/BHome.sln --verify-no-changes --no-restore
      - name: Verify SePay team configuration scripts without private credentials
        shell: pwsh
        run: ./scripts/Test-SePaySandboxScripts.ps1
      # Capture tests use the same source-built MinIO image as local Compose.
      - name: Set up dependency image cache
        uses: docker/setup-buildx-action@v3
      - name: Build MinIO image for integration tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Minio.Dockerfile
          load: true
          tags: bhome/minio-local:2025-10-15
          cache-from: type=gha,scope=backend-minio
          cache-to: type=gha,mode=max,scope=backend-minio,ignore-error=true
      - name: Build LibreOffice image for contract PDF integration tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/ContractConverter.Dockerfile
          load: true
          tags: bhome/contract-converter:local
          cache-from: type=gha,scope=backend-converter
          cache-to: type=gha,mode=max,scope=backend-converter,ignore-error=true
      - name: Capture disposable Compact24 statements without bind parameters
        env:
          COMPACT_POSTGRES: ${{ job.services.compact_postgres.id }}
        run: |
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "ALTER SYSTEM SET log_parameter_max_length = 0"
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "ALTER SYSTEM SET log_parameter_max_length_on_error = 0"
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "ALTER SYSTEM SET log_line_prefix = '%m [%p] db=%d '"
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "ALTER SYSTEM SET log_statement = 'all'"
          docker exec "$COMPACT_POSTGRES" psql -U bhome_ci -d postgres -c "SELECT pg_reload_conf()"
          docker logs --follow "$COMPACT_POSTGRES" > "$RUNNER_TEMP/bhome-compact24-statements.log" 2>&1 &
          echo "BHOME_COMPACT24_QUERY_LOG=$RUNNER_TEMP/bhome-compact24-statements.log" >> "$GITHUB_ENV"
      # CI runs only in-process/unit and isolated Testcontainers suites. The separate
      # BHome.PlanIntegrationTests project is a manually opted-in black-box suite that
      # contacts a running API and is unsafe to run as part of a default solution test.
      # Build/format still check the complete BHome.sln, including that project.
      - name: Discover the current backend test inventory
        run: python3 scripts/Capture-BackendDiscovery.py "$RUNNER_TEMP/bhome-backend-discovery"
        env:
          BHOME_COMPACT24_TEST_ADMIN: Host=127.0.0.1;Port=${{ job.services.compact_postgres.ports['5432'] }};Database=postgres;Username=bhome_ci;Password=synthetic-ci-only
      - run: dotnet test src/backend/BHome.CI.slnf -c Release --no-build --settings tests/backend/ci.runsettings --logger trx --results-directory "$RUNNER_TEMP/bhome-backend-trx" -m:1
        env:
          BHOME_COMPACT24_TEST_ADMIN: Host=127.0.0.1;Port=${{ job.services.compact_postgres.ports['5432'] }};Database=postgres;Username=bhome_ci;Password=synthetic-ci-only
      # Preserve concise test outcomes even if verbose Testcontainers logs are
      # too large for the Actions job-log download endpoint.
      - name: Require retained Staging hotfix regressions to execute and pass
        if: ${{ !cancelled() }}
        run: python3 scripts/Verify-StagingRegressions.py "$RUNNER_TEMP/bhome-backend-trx"
      - name: Require evidence for all backend test assemblies
        if: ${{ !cancelled() }}
        run: python3 scripts/Verify-BackendTrx.py "$RUNNER_TEMP/bhome-backend-trx" tests/backend/ci-test-inventory.json --discovery "$RUNNER_TEMP/bhome-backend-discovery/discovery.json"
      - name: Upload backend test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-trx-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bhome-backend-trx/*.trx
            ${{ runner.temp }}/bhome-backend-discovery/*
          if-no-files-found: error
          retention-days: 7
  frontend-quality:
    runs-on: ubuntu-24.04
    env:
      VITE_API_BASE_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build --workspace ./packages/client-core
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --project-name bhome-sepay-ci --env-file .env.sepay.example -f deploy/compose.sepay.yml config --quiet
      - name: Validate Staging deployment guards
        run: |
          for file in deploy/vps/*.sh; do bash -n "$file"; done
          python3 -m unittest discover -s tests/deployment -p 'test_*.py' -v
          python3 -m unittest discover -s tests/scripts -p 'test_email_preflight.py' -v
          node --test tests/deployment/*.test.cjs
  frontend-workspaces:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        workspace: [owner-web, public-web, mobile]
    env:
      VITE_API_BASE_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Typecheck Mobile
        if: matrix.workspace == 'mobile'
        run: npm run typecheck --workspace ./src/mobile
      - name: Test workspace
        run: npm run test --workspace ./src/${{ matrix.workspace }} -- --run --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/workspace-tests.xml"
      - name: Build web workspace
        if: matrix.workspace != 'mobile'
        run: npm run build --workspace ./src/${{ matrix.workspace }}
      - name: Install Chromium for Public Web regression
        if: matrix.workspace == 'public-web'
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Test Public Web browser workflows
        if: matrix.workspace == 'public-web'
        run: npm run test:browser --workspace ./src/public-web -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/browser-tests.xml"
      - name: Export Mobile web bundle
        if: matrix.workspace == 'mobile'
        working-directory: src/mobile
        run: npx --no-install expo export --platform web --max-workers 2 --output-dir dist
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid
      - name: Verify frontend test evidence
        if: ${{ !cancelled() }}
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          reports=("$RUNNER_TEMP/workspace-tests.xml")
          if [ "$WORKSPACE" = public-web ]; then reports+=("$RUNNER_TEMP/browser-tests.xml"); fi
          python3 scripts/Verify-FrontendEvidence.py "${reports[@]}"
      - name: Upload frontend test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: frontend-${{ matrix.workspace }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/*-tests.xml
          if-no-files-found: error
          retention-days: 7
  # Preserve the existing required status check; matrix jobs may not be skipped.
  frontend:
    if: ${{ always() }}
    needs: [frontend-quality, frontend-workspaces]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every frontend check
        env:
          QUALITY: ${{ needs.frontend-quality.result }}
          WORKSPACES: ${{ needs.frontend-workspaces.result }}
        run: test "$QUALITY" = success && test "$WORKSPACES" = success
  ci-quality-gate:
    if: ${{ always() }}
    needs: [backend, frontend, change-detection, build-staging-images]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify required job outcomes
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          SCOPE: ${{ needs.change-detection.result }}
          IMAGES: ${{ needs.build-staging-images.result }}
        run: node scripts/Verify-CiGate.cjs
  release:
    # The image-validation ancestor is intentionally skipped on push. An explicit
    # status function avoids implicit success() propagation, while every required
    # dependency still has to succeed before the reusable release is eligible.
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && needs.backend.result == 'success' && needs.frontend.result == 'success' && needs.ci-quality-gate.result == 'success' }}
    needs: [backend, frontend, ci-quality-gate]
    permissions:
      contents: read
      actions: read
      packages: write
      deployments: read
    uses: ./.github/workflows/release.yml
    secrets: inherit
  validate-api-image:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Api.Release.Dockerfile
          target: api
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/bhome-api:sha-${{ github.sha }}
          cache-from: |
            type=gha,scope=pr-validation-api
            type=gha,scope=release-api
          # Cache export is optional; image build failures still fail this job.
          cache-to: type=gha,mode=max,scope=pr-validation-api,ignore-error=true
  validate-web-images:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [owner-web, public-web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Validate web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Web.Dockerfile
          push: false
          build-args: |
            APP=${{ matrix.app }}
            VITE_API_BASE_URL=https://api-staging.103.146.23.157.sslip.io
            VITE_DEPLOYMENT_ENVIRONMENT=Staging
            BHOME_REVISION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/bhome-${{ matrix.app }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=pr-validation-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=pr-validation-${{ matrix.app }},ignore-error=true
  # Keep the historical check name and gate semantics even when independent builds fail.
  build-staging-images:
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') }}
    needs: [backend, frontend, validate-api-image, validate-web-images]
    runs-on: ubuntu-24.04
    steps:
      - name: Require CI and all image validations
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          API: ${{ needs.validate-api-image.result }}
          WEB: ${{ needs.validate-web-images.result }}
        run: test "$BACKEND" = success && test "$FRONTEND" = success && test "$API" = success && test "$WEB" = success
