# Prepare privately; apply only in an approved Production release.
# Contains no credentials and does not enable any payment integration.
services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      Deployment__Environment: Production
      Deployment__OwnerOrigin: https://owner.103.146.23.157.sslip.io
      Deployment__ApiOrigin: https://api.103.146.23.157.sslip.io
      Deployment__PublicOrigin: https://www.103.146.23.157.sslip.io
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          IFS= read -r response <&3;
          [[ "$$response" == *' 200 '* ]]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
  owner-web:
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  public-web:
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
