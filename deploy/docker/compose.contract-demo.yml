services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bhome_contract_demo
      POSTGRES_USER: contract_demo
      POSTGRES_PASSWORD: ${CONTRACT_DEMO_DB_PASSWORD:?Use Initialize-ContractDemo.ps1}
    ports: ['127.0.0.1:56432:5432']
    volumes: [contract-demo-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contract_demo -d bhome_contract_demo']
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    build:
      context: ../..
      dockerfile: deploy/docker/Minio.Dockerfile
    image: bhome/minio-local:2025-10-15
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: contract-demo
      MINIO_ROOT_PASSWORD: ${CONTRACT_DEMO_STORAGE_PASSWORD:?Use Initialize-ContractDemo.ps1}
    ports: ['127.0.0.1:59000:9000', '127.0.0.1:59001:9001']
    volumes: [contract-demo-minio:/data]
volumes:
  contract-demo-postgres:
  contract-demo-minio:
