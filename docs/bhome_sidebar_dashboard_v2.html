<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BHOME Owner Portal – bản mẫu quản lý cơ sở, phòng và vốn đầu tư"
    />
    <title>BHOME | Owner Portal · Prototype v2</title>
    <style>
      :root {
        --bg: #f6f8fc;
        --paper: #fff;
        --navy: #15243e;
        --muted: #75839b;
        --border: #e6ebf2;
        --blue: #255dde;
        --blue-light: #ebf2ff;
        --green: #159a60;
        --amber: #cb8b16;
        --red: #db4d49;
        --grey: #8290a5;
        --shadow: 0 8px 28px rgba(31, 57, 91, 0.035);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Arial,
          sans-serif;
        color: var(--navy);
        font-size: 14px;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 3px solid #9bb9ff;
        outline-offset: 2px;
      }
      #app {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 258px;
        flex: 0 0 258px;
        background: #fff;
        border-right: 1px solid var(--border);
        height: 100vh;
        position: sticky;
        top: 0;
        display: flex;
        flex-direction: column;
        transition: 0.2s;
      }
      .sidebar.small {
        width: 76px;
        flex-basis: 76px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 24px 19px 21px;
        border-bottom: 1px solid var(--border);
      }
      .brandmark {
        width: 37px;
        height: 37px;
        border-radius: 11px;
        background: var(--blue);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 850;
        font-size: 22px;
      }
      .brandname {
        font-weight: 850;
        font-size: 18px;
        letter-spacing: 0.15px;
      }
      .brandtag {
        font-size: 10px;
        color: var(--muted);
        margin-top: 2px;
      }
      .nav-scroll {
        overflow-y: auto;
        padding: 14px 11px 26px;
        flex: 1;
        scrollbar-width: thin;
      }
      .navgroup {
        margin-bottom: 18px;
      }
      .group-label {
        font-weight: 800;
        color: #a0a9bb;
        font-size: 10px;
        letter-spacing: 1.15px;
        margin: 0 13px 9px;
        text-transform: uppercase;
      }
      .navitem {
        border: 0;
        background: transparent;
        color: #53657f;
        text-align: left;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 10px 12px;
        border-radius: 9px;
        margin: 2px 0;
        min-height: 41px;
        font-size: 13px;
      }
      .navitem:hover {
        background: #f4f7fc;
      }
      .navitem.active {
        background: var(--blue-light);
        color: var(--blue);
        font-weight: 800;
      }
      .navitem svg {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
      }
      .navdivider {
        height: 1px;
        background: var(--border);
        margin: 12px 7px 18px;
      }
      .sidebar-footer {
        border-top: 1px solid var(--border);
        padding: 13px 12px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .avatar {
        background: #e1eaff;
        color: #1e55bc;
        display: flex;
        width: 34px;
        height: 34px;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        border-radius: 11px;
      }
      .avatarlabel {
        font-weight: 750;
        font-size: 12px;
      }
      .avatarsub {
        font-size: 10px;
        color: var(--muted);
        margin-top: 3px;
      }
      .sidebar.small .hide-small,
      .sidebar.small .group-label,
      .sidebar.small .avatarlabel,
      .sidebar.small .avatarsub {
        display: none;
      }
      .sidebar.small .brand {
        padding: 22px 18px;
      }
      .sidebar.small .navitem {
        justify-content: center;
        padding: 13px;
      }
      .sidebar.small .navitem svg {
        width: 21px;
        height: 21px;
      }
      .sidebar.small .nav-scroll {
        padding: 14px 9px;
      }
      .sidebar.small .sidebar-footer {
        justify-content: center;
      }
      .shell {
        flex: 1;
        min-width: 0;
      }
      .topbar {
        height: 75px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 30px;
        background: #fff;
        position: sticky;
        top: 0;
        z-index: 15;
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #8490a4;
        white-space: nowrap;
        overflow: hidden;
      }
      .crumb b {
        color: #364965;
        font-weight: 800;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .top-right {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .demo-tag {
        font-size: 10px;
        background: #fffae8;
        border: 1px solid #f0e4ae;
        color: #99732e;
        padding: 6px 9px;
        border-radius: 15px;
        font-weight: 750;
        white-space: nowrap;
      }
      .top-select {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 33px 10px 12px;
        background: white;
        color: #253954;
        font-size: 12px;
        max-width: 215px;
        outline: none;
        cursor: pointer;
      }
      .roundbtn {
        height: 36px;
        width: 36px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #617087;
      }
      .roundbtn svg {
        width: 17px;
        height: 17px;
      }
      .main {
        max-width: 1480px;
        margin: auto;
        padding: 30px 34px 50px;
      }
      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .eyebrow {
        color: var(--blue);
        font-size: 11px;
        font-weight: 850;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        margin-bottom: 9px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        letter-spacing: -0.65px;
        font-weight: 850;
      }
      h2 {
        font-size: 17px;
        margin: 0;
        font-weight: 820;
        letter-spacing: -0.15px;
      }
      h3 {
        font-size: 14px;
        margin: 0;
        font-weight: 790;
      }
      p {
        margin: 0;
      }
      .subtitle {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }
      .btn {
        padding: 10px 15px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #fff;
        color: #3a506f;
        font-size: 12px;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        white-space: nowrap;
        min-height: 38px;
      }
      .btn:hover {
        background: #f4f7fc;
      }
      .btn.primary {
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
      }
      .btn.primary:hover {
        background: #194cbb;
      }
      .btn svg {
        height: 15px;
        width: 15px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 20px;
      }
      .stat {
        background: var(--paper);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 17px 19px;
        box-shadow: var(--shadow);
      }
      .stat-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .stat-label {
        font-size: 12px;
        color: #718097;
        font-weight: 680;
      }
      .stat-icon {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: #edf3ff;
        color: #2e68d4;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stat-icon svg {
        width: 18px;
        height: 18px;
      }
      .stat-value {
        font-size: 27px;
        font-weight: 880;
        margin-top: 14px;
        letter-spacing: -0.8px;
      }
      .stat-hint {
        font-size: 11px;
        color: #929cad;
        margin-top: 5px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 15px;
        box-shadow: var(--shadow);
      }
      .card-header {
        padding: 19px 20px 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
      }
      .card-body {
        padding: 0 20px 20px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .tiny {
        font-size: 11px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .between {
        justify-content: space-between;
      }
      .two-col {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr);
        gap: 17px;
      }
      .location-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .location-card {
        padding: 20px;
        cursor: pointer;
        transition:
          transform 0.16s,
          border-color 0.16s;
      }
      .location-card:hover {
        border-color: #b5ccfa;
        transform: translateY(-2px);
      }
      .location-icon {
        height: 36px;
        width: 36px;
        border-radius: 11px;
        background: #eef4ff;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2b60c8;
      }
      .location-icon svg {
        height: 20px;
        width: 20px;
      }
      .location-title {
        font-size: 15px;
        font-weight: 850;
        margin-top: 16px;
      }
      .location-address {
        font-size: 11px;
        color: var(--muted);
        margin: 6px 0 17px;
      }
      .progress-track {
        height: 7px;
        background: #e9edf4;
        border-radius: 10px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: var(--green);
        border-radius: 10px;
      }
      .line {
        border-top: 1px solid var(--border);
      }
      .loc-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 14px;
        margin-top: 15px;
        color: #53657c;
        font-size: 11px;
      }
      .section {
        margin-top: 24px;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .link {
        background: none;
        border: 0;
        color: var(--blue);
        font-weight: 800;
        font-size: 12px;
        padding: 5px 0;
      }
      .link:hover {
        text-decoration: underline;
      }
      .donut {
        height: 128px;
        width: 128px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 128px;
      }
      .donut-hole {
        width: 95px;
        height: 95px;
        background: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .donut-number {
        font-weight: 850;
        font-size: 26px;
        letter-spacing: -0.7px;
      }
      .donut-label {
        font-size: 10px;
        color: var(--muted);
      }
      .occupancy-body {
        display: flex;
        align-items: center;
        gap: 25px;
        padding: 5px 0 10px;
      }
      .legend {
        flex: 1;
        min-width: 0;
      }
      .legend-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        padding: 9px 0;
        border-bottom: 1px solid #f0f2f7;
      }
      .legend-item:last-child {
        border: 0;
      }
      .dot {
        height: 8px;
        width: 8px;
        border-radius: 50%;
        display: inline-block;
        vertical-align: middle;
        margin-right: 7px;
      }
      .alert {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        border-top: 1px solid var(--border);
        padding: 13px 0;
      }
      .alert:first-child {
        border-top: none;
      }
      .alert-ico {
        background: #fff4ed;
        color: #c96427;
        width: 33px;
        height: 33px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        flex-shrink: 0;
      }
      .alert-ico svg {
        width: 17px;
        height: 17px;
      }
      .alert-title {
        font-weight: 780;
        font-size: 12px;
        margin-bottom: 4px;
      }
      .alert-sub {
        color: var(--muted);
        font-size: 11px;
      }
      .subnav {
        display: flex;
        align-items: center;
        gap: 5px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 23px;
        overflow-x: auto;
        white-space: nowrap;
      }
      .subnav button {
        border: 0;
        background: transparent;
        padding: 13px 15px;
        color: #718198;
        font-size: 12px;
        font-weight: 750;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      .subnav button:hover {
        color: var(--blue);
      }
      .subnav button.selected {
        color: var(--blue);
        border-bottom-color: var(--blue);
      }
      .floor-preview {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
      }
      .roomtile {
        border: 1px solid var(--border);
        padding: 12px;
        border-radius: 10px;
        text-align: left;
        background: white;
        cursor: pointer;
        min-width: 0;
        box-shadow: 0 1px 2px rgba(30, 45, 70, 0.02);
        transition: transform 0.14s;
      }
      .roomtile:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 17px rgba(30, 45, 70, 0.07);
      }
      .roomtile.occupied {
        background: #f2fcf6;
        border-color: #c5ebd6;
      }
      .roomtile.available {
        background: #f1f6ff;
        border-color: #cddffc;
      }
      .roomtile.hold {
        background: #fffaec;
        border-color: #f5e2b5;
      }
      .roomtile.unavailable {
        background: #f5f6f9;
        border-color: #dbe0e8;
      }
      .roomtile .roomcode {
        font-weight: 850;
        font-size: 14px;
        margin-bottom: 8px;
      }
      .roomtile .roommeta {
        font-size: 11px;
        color: #69809a;
        margin-top: 5px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .roomtile .roommeta svg {
        width: 12px;
        height: 12px;
      }
      .status {
        font-size: 10px;
        font-weight: 850;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .status.occupied {
        color: #158450;
      }
      .status.available {
        color: #2c67ca;
      }
      .status.hold {
        color: #a37013;
      }
      .status.unavailable {
        color: #68768c;
      }
      .pill {
        font-size: 10px;
        font-weight: 750;
        padding: 5px 8px;
        border-radius: 8px;
        background: #f0f4fa;
        color: #647892;
      }
      .pill.red {
        background: #ffebeb;
        color: #d94c4a;
      }
      .pill.green {
        background: #e8f8ee;
        color: #208959;
      }
      .pill.amber {
        background: #fff2d7;
        color: #b27b13;
      }
      .pill.blue {
        background: #e8f0ff;
        color: #275ecc;
      }
      .toolrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .tools {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .search {
        border: 1px solid var(--border);
        background: #fff;
        padding: 11px 12px;
        border-radius: 10px;
        min-width: 240px;
        font-size: 12px;
      }
      .filter {
        border: 1px solid var(--border);
        background: #fff;
        padding: 11px 12px;
        border-radius: 10px;
        font-size: 12px;
        color: #41536d;
      }
      .floor-group {
        margin-bottom: 18px;
      }
      .floor-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .floor-head strong {
        font-size: 13px;
      }
      .badge {
        background: #f1f4f9;
        color: #74849a;
        border-radius: 20px;
        font-size: 10px;
        padding: 4px 8px;
      }
      .typegrid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 15px;
      }
      .type-card {
        padding: 20px;
      }
      .asset-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid #eff2f6;
        padding: 9px 0;
        color: #6c7a91;
        font-size: 11px;
      }
      .type-card h3 {
        margin: 12px 0 4px;
      }
      .kpi-label {
        color: #72819a;
        font-size: 11px;
      }
      .tablewrap {
        overflow: auto;
      }
      .datatable {
        border-collapse: collapse;
        width: 100%;
        min-width: 620px;
      }
      .datatable th {
        text-align: left;
        color: #79879c;
        background: #f8fafd;
        font-size: 11px;
        font-weight: 850;
        padding: 14px 16px;
      }
      .datatable td {
        padding: 14px 16px;
        border-top: 1px solid #edf1f6;
        font-size: 12px;
      }
      .right {
        text-align: right;
      }
      .category-box {
        background: #f8fafd;
        border-radius: 11px;
        padding: 18px;
      }
      .list-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 13px 0;
        border-top: 1px solid #eff2f6;
        gap: 15px;
      }
      .list-row:first-child {
        border: 0;
      }
      .hintbox {
        border: 1px solid #d6e5ff;
        background: #f1f7ff;
        padding: 13px 15px;
        border-radius: 11px;
        color: #49668e;
        font-size: 12px;
        line-height: 1.6;
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(19, 31, 49, 0.36);
        z-index: 50;
        display: flex;
        justify-content: flex-end;
      }
      .drawer {
        width: min(460px, 100%);
        background: #fff;
        height: 100%;
        overflow-y: auto;
        padding: 25px;
        box-shadow: -10px 0 32px rgba(0, 0, 0, 0.08);
      }
      .modal-overlay {
        justify-content: center;
        align-items: center;
        padding: 15px;
      }
      .modal {
        background: #fff;
        border-radius: 16px;
        padding: 25px;
        width: min(530px, 100%);
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.16);
      }
      .xbtn {
        border: 0;
        background: #f5f7fb;
        border-radius: 9px;
        width: 32px;
        height: 32px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .formfield {
        display: block;
        margin-top: 16px;
      }
      .formfield label {
        font-size: 12px;
        font-weight: 800;
        display: block;
        margin-bottom: 7px;
      }
      .formfield input,
      .formfield select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 11px 12px;
        font-size: 12px;
        background: #fff;
      }
      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 0;
        border-top: 1px solid var(--border);
      }
      .setting:first-child {
        border: 0;
      }
      .switch {
        appearance: none;
        width: 35px;
        height: 21px;
        background: #d5dce7;
        border-radius: 20px;
        position: relative;
        cursor: pointer;
        transition: background 0.2s;
      }
      .switch:checked {
        background: var(--blue);
      }
      .switch:after {
        content: '';
        width: 15px;
        height: 15px;
        background: white;
        border-radius: 50%;
        position: absolute;
        left: 3px;
        top: 3px;
        transition: transform 0.2s;
      }
      .switch:checked:after {
        transform: translateX(14px);
      }
      .empty {

          Number.isInteger(start) && start > 0 && prefix.trim() && n
            ? Array.from({ length: n }, (_, i) => prefix + (start + i))
            : [];

          db.rooms.some(
            (r) => r.locationId === UI.locationId && r.code.toLowerCase() === code.toLowerCase(),
          ),
        );

        if (el)
          el.innerHTML = `<div>${
            codes.length
              ? codes
                  .slice(0, 15)
                  .map(
                    (c) =>
                      `<span class="pill ${duplicate.includes(c) ? 'red' : 'blue'}">${H(c)}</span>`,
                  )
                  .join(' ')
              : 'Nhập số bắt đầu và số lượng hợp lệ'

          'Đối tượng áp dụng',
          'scopeId',
          options,
          p?.scope === s ? p.scopeId : options[0]?.[0] || '',

      function input(e) {
        if (UI.modal === 'bulkRoom' && e.target.closest('#bulkRoomForm')) renderBulkPreview();
        if (e.target.id === 'searchRooms') {
          UI.search = e.target.value;
          let pos = e.target.selectionStart;
          render();
          let x = document.getElementById('searchRooms');
          if (x) {
            x.focus();
            x.setSelectionRange(pos, pos);
          }
        }
      }
      document.addEventListener('click', action);
      document.addEventListener('submit', frm);
      document.addEventListener('change', change);
      document.addEventListener('input', input);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && UI.modal) {
          UI.modal = null;
          render();
        } else if (e.key === 'Escape' && UI.drawer && UI.view !== 'roomDetail') {
          UI.drawer = null;
          render();
        } else if (e.key === 'Enter' && e.target.closest('.location-card')) {
          e.preventDefault();
          go('location', e.target.closest('.location-card').dataset.id);
        }
      });
      render();
    </script>
  </body>
</html>
